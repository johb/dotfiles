# tmux.conf
# ----------------------------------------------------------------------------
# Key bindings
# ----------------------------------------------------------------------------
# Default: local tmux
set -g prefix C-Space
unbind C-b

# Remote: tmux launched from an SSH session
if-shell '[ -n "$SSH_CONNECTION" ]' {
	    set -g prefix C-b
		    unbind C-Space
}

# Forward 'ctrl'-'a' if it's pressed twice
bind-key C-a send-prefix
# Use emacs keybindings in the status line
set-option -g status-keys emacs

# Split panes: | horizontal, - vertical
unbind-key '"'
unbind-key %
bind-key | split-window -h
bind-key - split-window -v

# Pane navigation: Switch panes with vi keybindings
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Pane swapping
# swap with right pane
bind-key C-j swap-pane -D
# swap with upper pane
bind-key C-k swap-pane -U

# Resize pane
bind-key -r H resize-pane -L 2
bind-key -r L resize-pane -R 2
bind-key -r K resize-pane -U 2
bind-key -r J resize-pane -D 2

# Reload configuration
bind-key r source-file ~/.tmux.conf \; display "Config reloaded"
bind-key -T copy-mode n send-keys -X next-prompt
bind-key -T copy-mode p send-keys -X previous-prompt

# Prompt for name and create new window
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"

# Toggle mouse mode with prefix + m
bind m if -F '#{mouse}' \
	'set -g mouse off; display-message "Mouse: OFF"' \
	'set -g mouse on; display-message "Mouse: ON"'
# ----------------------------------------------------------------------------
# Copy mode
# ----------------------------------------------------------------------------
set -g set-clipboard off

# Use vi keybindings in copy mode
setw -g mode-keys vi

unbind-key [
unbind-key ]

bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# macOS Terminal app
if-shell 'uname | grep -q Darwin' {
	bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

if-shell 'uname | grep -q Linux' {
	bind-key p paste-buffer
	bind-key -T copy-mode-vi y send-keys -X copy-selection
	bind-key -T copy-mode-vi C-v send-keys -X paste-buffer
}
# ----------------------------------------------------------------------------
# Visuals
# ----------------------------------------------------------------------------
# Position of status line
set -g status-position bottom
set -g status-justify left
# Status interval
set-option -g status-interval 1
setw -g window-status-separator ' '
set -g pane-border-lines heavy
setw -g window-status-format ' #[fg=default]#I┃#W#F '
setw -g window-status-current-format '▶#[bold]#I┃#W#F '

# Local
set -g status-style 'fg=white,bg=blue'
set -g status-left '#[fg=colour18,bold]@#H #[default] '
set -g status-left-length 15
set -g status-right '#[fg=colour18] #(uptime) · %H:%M '
setw -g window-status-style 'fg=black,bg=blue'
setw -g window-status-current-style 'fg=black,bg=cyan,bold'
set -g pane-active-border-style 'fg=cyan'

# Remote
if-shell '[ -n "$SSH_CONNECTION" ]' {
	set -g status-style 'fg=black,bg=green'
	set -g status-left '#[fg=black,bold] #H #[default] '
	set -g status-right '#[fg=colour22] #(uptime) · %H:%M '
	setw -g window-status-style 'fg=colour22,bg=green'
	setw -g window-status-current-style 'fg=black,bg=brightgreen,bold'
	set -g pane-active-border-style 'fg=brightgreen'
}

